# Configuración de la aplicación Spring Boot
# Las variables se obtienen desde el entorno (ConfigMap y Secret de Kubernetes)

# Puerto del servidor (obtenido desde ConfigMap)
server.port=${APP_PORT:8080}

# Configuración de MongoDB (obtenida desde ConfigMap y Secret)
# La URI se construye en MongoConfig.java usando las variables de entorno:
# - DB_HOST (desde ConfigMap)
# - DB_NAME (desde ConfigMap)
# - DB_USER (desde Secret)
# - DB_PASS (desde Secret)

# Nombre de la aplicación
spring.application.name=backend-practica

# Configuración de logging
logging.level.root=INFO
logging.level.com.practica.backend=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Configuración de Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
