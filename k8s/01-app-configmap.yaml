# ConfigMap para configuración no sensible de la aplicación
# Contiene variables de entorno para conectar el Backend con MongoDB
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-configmap
  namespace: practica-s08
  labels:
    app: backend
    tier: config
data:
  # Host del servicio MongoDB (nombre del Service de Kubernetes)
  DB_HOST: mongo-service
  
  # Nombre de la base de datos a utilizar
  DB_NAME: practica_db
  
  # Puerto en el que escucha la aplicación Spring Boot
  APP_PORT: "8080"
