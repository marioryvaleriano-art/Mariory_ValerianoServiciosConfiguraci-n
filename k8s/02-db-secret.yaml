# Secret para credenciales sensibles de MongoDB
# Los valores están codificados en Base64 por seguridad
# IMPORTANTE: En producción, gestionar estos secretos de forma más segura
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s08
  labels:
    app: mongodb
    tier: database
type: Opaque
data:
  # Usuario de MongoDB (adminpractica en Base64)
  # Para generar: echo -n "adminpractica" | base64
  DB_USER: YWRtaW5wcmFjdGljYQ==
  
  # Contraseña de MongoDB (practica2024 en Base64)
  # Para generar: echo -n "practica2024" | base64
  DB_PASS: cHJhY3RpY2EyMDI0
