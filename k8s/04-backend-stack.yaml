# Stack completo del Backend: Deployment + Service (NodePort)
---
# Deployment del Backend Spring Boot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s08
  labels:
    app: backend
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      tier: application
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
      - name: backend
        # Imagen Docker construida localmente
        image: backend-practica:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        # Inyección de variables desde ConfigMap y Secret usando envFrom
        envFrom:
        - configMapRef:
            name: app-configmap
        - secretRef:
            name: db-secret
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        # Readiness probe para verificar que la aplicación está lista
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Liveness probe para verificar que la aplicación está funcionando
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

---
# Service de tipo NodePort para exponer el Backend externamente
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s08
  labels:
    app: backend
    tier: application
spec:
  type: NodePort
  selector:
    app: backend
    tier: application
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
